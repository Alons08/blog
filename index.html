<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Una invitación especial</title>
  <link rel="stylesheet" href="css/styles.css" />
  <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Montserrat:wght@400;600&display=swap" rel="stylesheet">
</head>
<body>
  <div class="container">
    <div class="photo-frame">
      <img src="img/lola2.png" alt="Lola" class="profile-photo">
      <div class="frame-decoration"></div>
    </div>
    <h1 class="greeting">¡Hola, Lola bonita! 💖</h1>
    <p class="message">Espero que hayas tenido un hermoso día así como tú 🌷</p>
    <button onclick="showInvitation()" class="btn">Descubre algo especial 💫</button>
  </div>

  <!-- Widget de SoundCloud (oculto) -->
  <iframe id="soundcloudWidget" width="0" height="0" scrolling="no" frameborder="no" allow="autoplay" src="https://w.soundcloud.com/player/?url=https%3A//api.soundcloud.com/tracks/123456789&color=%23ff758c&auto_play=false&hide_related=true&show_comments=false&show_user=false&show_reposts=false&show_teaser=false"></iframe>

  <!-- Audio alternativo (oculto) -->
  <audio id="treasureSong" loop>
    <source src="https://audio-example.com/treasure.mp3" type="audio/mpeg">
  </audio>

  <canvas id="confetti"></canvas>

  <!-- SweetAlert JS -->
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script src="js/script.js"></script>
</body>
</html>
