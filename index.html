<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Una invitación especial</title>
  <link rel="stylesheet" href="css/styles.css" />
  <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Montserrat:wght@400;600&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>
<body>
  <div class="container">
    <div class="photo-frame">
      <img src="img/lola2.png" alt="Lola" class="profile-photo">
      <div class="frame-decoration"></div>
    </div>
    <h1 class="greeting">¡Hola, Lola bonita! 💖</h1>
    <p class="message">Espero que hayas tenido un hermoso día así como tú 🌷</p>
    <button onclick="showInvitation()" class="btn">Clic aquí para descubrir algo especial💫</button>
  </div>

  <canvas id="confetti"></canvas>

  <script src="js/script.js"></script>
</body>
</html>
